<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Task Manager | Sameer Kumar</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
        .container { width: 100%; max-width: 650px; background: #1e293b; padding: 28px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        h1 { margin: 0 0 6px 0; font-size: 24px; color: #38bdf8; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
        input { flex: 1; min-width: 200px; }
        button { padding: 12px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .btn-add { background: #38bdf8; color: #0f172a; }
        .btn-add:hover { background: #0284c7; color: #fff; }
        .task-card { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .task-info h3 { margin: 0 0 6px 0; font-size: 16px; }
        .completed-text { text-decoration: line-through; color: #64748b; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; text-transform: uppercase; font-weight: bold; margin-right: 6px; }
        .high { background: #ef444433; color: #f87171; }
        .medium { background: #f59e0b33; color: #fbbf24; }
        .low { background: #10b98133; color: #34d399; }
        .status-badge { background: #3b82f633; color: #60a5fa; }
        .actions { display: flex; gap: 8px; }
        .btn-done { background: #10b981; color: #fff; padding: 8px 12px; font-size: 12px; }
        .btn-del { background: #ef4444; color: #fff; padding: 8px 12px; font-size: 12px; }
        #statusMsg { font-size: 13px; color: #34d399; margin-bottom: 12px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>☁️ AWS Serverless Task Manager</h1>
        <div class="subtitle">Developed by <b>Sameer Kumar</b> (B.Tech CSE, IIMT) | Powered by AWS Lambda, API Gateway & DynamoDB</div>

        <div class="form-group">
            <input type="text" id="taskTitle" placeholder="Enter a new task (e.g., Prepare COA Notes)..." />
            <select id="taskPriority">
                <option value="high">High Priority</option>
                <option value="medium" selected>Medium Priority</option>
                <option value="low">Low Priority</option>
            </select>
            <button class="btn-add" onclick="addTask()">+ Add Task</button>
        </div>

        <div id="statusMsg">Loading tasks from AWS DynamoDB...</div>
        <div id="taskList"></div>
    </div>

    <script>
        const API_URL = "https://gs0g35wdye.execute-api.ap-southeast-2.amazonaws.com/prod/tasks";

        async function fetchTasks() {
            const msg = document.getElementById("statusMsg");
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderTasks(data.tasks || []);
                msg.textContent = `✅ Connected to AWS Cloud (${data.count || 0} tasks loaded)`;
            } catch (err) {
                msg.style.color = "#f87171";
                msg.textContent = "❌ Error connecting to API. Make sure CORS is enabled in API Gateway.";
            }
        }

        function renderTasks(tasks) {
            const list = document.getElementById("taskList");
            if (tasks.length === 0) {
                list.innerHTML = "<p style='color:#64748b; text-align:center;'>No tasks yet. Add one above!</p>";
                return;
            }
            list.innerHTML = tasks.map(t => `
                <div class="task-card">
                    <div class="task-info">
                        <h3 class="${t.status === 'completed' ? 'completed-text' : ''}">${t.title}</h3>
                        <span class="badge ${t.priority}">${t.priority}</span>
                        <span class="badge status-badge">${t.status}</span>
                    </div>
                    <div class="actions">
                        ${t.status !== 'completed' ? `<button class="btn-done" onclick="completeTask('${t.task_id}')">✓ Done</button>` : ''}
                        <button class="btn-del" onclick="deleteTask('${t.task_id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function addTask() {
            const titleInput = document.getElementById("taskTitle");
            const priority = document.getElementById("taskPriority").value;
            const title = titleInput.value.trim();
            if (!title) return alert("Please enter a task title!");

            document.getElementById("statusMsg").textContent = "⏳ Saving to AWS DynamoDB...";
            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, priority })
            });
            titleInput.value = "";
            fetchTasks();
        }

        async function completeTask(id) {
            document.getElementById("statusMsg").textContent = "⏳ Updating status in AWS...";
            await fetch(`${API_URL}/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: "completed" })
            });
            fetchTasks();
        }

        async function deleteTask(id) {
            document.getElementById("statusMsg").textContent = "⏳ Deleting from DynamoDB...";
            await fetch(`${API_URL}/${id}`, { method: "DELETE" });
            fetchTasks();
        }

        fetchTasks();
    </script>
</body>
</html>
